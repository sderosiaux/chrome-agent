<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Filter baseline</title>
</head>
<body>
  <h1>Filter baseline</h1>
  <main>
    <p>Prose that carries none of the roles a filter would ask for.</p>
    <a href="#anchor">A link</a>
    <label for="roast">Roast</label>
    <select id="roast">
      <option value="light">Light</option>
      <option value="dark">Dark</option>
    </select>
    <button id="go">Go</button>
  </main>
  <footer>
    <p>Footer prose, also unfiltered.</p>
  </footer>
  <div id="slot"></div>
</body>
</html>

<!doctype html>
<html>
<head>
<title>Iframe overlay</title>
<style>
  #target { position: absolute; top: 100px; left: 100px; width: 200px; height: 60px; }
  #frame { position: absolute; top: 0; left: 0; width: 100%; height: 400px; border: 0; }
</style>
</head>
<body>
  <a id="target" href="#next" onclick="window.receiver = 'target'; return false;">Next</a>
  <!-- Genuinely inert content — an ordinary search box, nothing that consents to anything.
       The point of this fixture is that guard mode cannot know that from outside: it refuses
       an iframe receiver unconditionally, so this one is a deliberate, accepted false positive,
       not a missed true one. -->
  <iframe id="frame" srcdoc="&lt;p&gt;An ordinary search box&lt;/p&gt;"></iframe>
  <p id="report">nothing yet</p>
  <script>
    window.receiver = null;
  </script>
</body>
</html>

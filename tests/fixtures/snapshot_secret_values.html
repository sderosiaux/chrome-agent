<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>snapshot: secret values reach stdout</title></head>
<body>
<!-- The accessibility snapshot is the widest path a value takes to stdout: `inspect` prints it,
     and every action report quotes the same lines back in `delta`.

     Chrome masks a `type=password` in the tree, so the leak is the OTHER half of
     `element::SECRET_FIELD` — a secret in a `type=text` field, named as one only by its
     `autocomplete` attribute:
       - #card  autocomplete=cc-number     -> the tree reports the digits verbatim
       - #cvc   autocomplete=cc-csc
       - #otp   autocomplete=one-time-code
       - #pw    type=password              -> masked by Chrome; redacted on its kind anyway,
                                              because the mask is not the classification
       - #note  an ordinary field          -> printed, which is the point of the field
     #preview echoes the card number into a generic node, the way a checkout page shows what it
     is about to charge: the same digits reach the same output without ever being a value=.
     The fields are pre-filled so `inspect` alone leaks, with no action needed. -->
<h1>Checkout</h1>
<form id="pay" action="about:blank">
  <label for="card">Card number</label>
  <input id="card" name="card" type="text" autocomplete="cc-number" value="4111111111111111">
  <label for="cvc">Security code</label>
  <input id="cvc" name="cvc" type="text" autocomplete="cc-csc" value="7391">
  <label for="otp">One-time code</label>
  <input id="otp" name="otp" type="text" autocomplete="one-time-code" value="903214">
  <label for="pw">Password</label>
  <input id="pw" name="pw" type="password" autocomplete="current-password" value="hunter2secret">
  <label for="note">Note for the courier</label>
  <input id="note" name="note" type="text" value="leave at the door">
  <button id="pay-submit" type="button">Pay</button>
</form>
<p>Charging card <span id="preview">4111111111111111</span></p>
<p id="status">idle</p>
<script>
  document.getElementById('card').addEventListener('input', function () {
    document.getElementById('preview').textContent = this.value;
  });
  // A click that moves the page without touching any field: the delta it reports still quotes
  // every line above, which is how an action leaks a value it never read.
  document.getElementById('pay-submit').addEventListener('click', function () {
    document.getElementById('status').textContent = 'paid';
  });
</script>
</body>
</html>

<!doctype html>
<html style="scroll-behavior: smooth">
<head>
  <meta charset="utf-8">
  <title>Smooth scroll click</title>
</head>
<body>
  <p>Top of the page.</p>
  <div style="height: 3000px">spacer — the target sits far below the fold</div>
  <button id="target" onclick="document.title = 'clicked'">Click me</button>
</body>
</html>

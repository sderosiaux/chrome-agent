<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>form-values: readonly input</title></head>
<body>
<!-- Looks identical to the disabled case to a naive detector, but the honest
     verdict is the OPPOSITE. readonly blocks user editing only: the native
     setter lands, AND a readonly control IS submitted with its form.
     Verified: fill exits 0, #ro.value === "overwritten", a11y line reads
       value="overwritten" readonly
     Expected verdict: changed, carrying caveat="readonly".
     Emitting blocked here would be a false negative that costs a wasted retry. -->
<h1>Readonly input</h1>
<form id="f" action="about:blank">
  <label for="ro">Reference</label>
  <input id="ro" name="ref" type="text" value="locked" readonly>
  <button id="submit" type="submit">Save</button>
</form>
<p id="marker">reference is generated by the server</p>
</body>
</html>

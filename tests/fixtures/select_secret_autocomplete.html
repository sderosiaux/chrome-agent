<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Select naming a secret</title>
</head>
<body>
  <!-- `element::SECRET_FIELD` is the one predicate that decides what gets redacted, and it
       reads `autocomplete` on whatever element it is handed. A <select> declaring a password
       is nonsense HTML, and it is also the only way to reach the predicate on a dropdown —
       so it is what pins the behaviour: the option text must not reach stdout through the
       report or through the message, exactly as a filled password does not. -->
  <select id="secret" autocomplete="new-password">
    <option value="a" selected>Alpha</option>
    <option value="b">Sesame</option>
  </select>
  <!-- The control: same markup, no autocomplete, and DELIBERATELY different option labels.
       `snapshot_secret` registers a secret field's rendered value as a searched string and
       scrubs any node whose name contains it (its documented fail-safe against a page echoing
       the value elsewhere). Sharing labels with the select above therefore redacted this one's
       options too — an artefact of the fixture, not of the tool, and one that would have made
       the redaction look page-wide when it is per element. Distinct labels let the test assert
       the difference instead of explaining it away. -->
  <select id="plain">
    <option value="c" selected>Gamma</option>
    <option value="d">Delta</option>
  </select>
</body>
</html>

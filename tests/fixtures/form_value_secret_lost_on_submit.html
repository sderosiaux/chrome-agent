<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>form-values: secrets lost on submit</title></head>
<body>
<!-- The redaction half of `values_lost`, and its negative.
     #pay resets on submit, so every field in it goes from holding a value to holding none:
       - #card    type=text autocomplete=cc-number  -> the accessibility tree reports the value
                  VERBATIM, so this is the field a `was` would leak. `fill` redacts it on the
                  autocomplete attribute alone, and `values_lost` has to agree.
       - #pw      type=password -> Chrome masks it in the tree, so `was` would carry bullets
                  rather than the secret. Redacted anyway: the classification is the field's
                  kind, not what the mask happened to reveal.
       - #note    an ordinary field -> reported with its value, which is the point of the field.
     #keep does NOT reset, so a submit there must emit no values_lost at all. Without that
     half, a report that fired on every click would pass the positive test. -->
<h1>Checkout</h1>
<form id="pay" action="about:blank">
  <label for="card">Card number</label>
  <input id="card" name="card" type="text" autocomplete="cc-number" value="">
  <label for="pw">Password</label>
  <input id="pw" name="pw" type="password" autocomplete="current-password" value="">
  <label for="note">Note</label>
  <input id="note" name="note" type="text" value="">
  <button id="pay-submit" type="submit">Pay</button>
</form>
<form id="keep" action="about:blank">
  <label for="search">Search</label>
  <input id="search" name="search" type="text" value="">
  <button id="keep-submit" type="submit">Search</button>
</form>
<p id="status">idle</p>
<script>
  document.getElementById('pay').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('status').textContent = 'paid';
    document.getElementById('pay').reset();
  });
  // The control: a submit that keeps what was typed.
  document.getElementById('keep').addEventListener('submit', function (e) {
    e.preventDefault();
    document.getElementById('status').textContent = 'searched';
  });
</script>
</body>
</html>

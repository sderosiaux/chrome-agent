<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>Secret field shapes</title></head>
<body>
<h1>Fields a structural type=password test misses</h1>

<!-- Secrets the DOM does not spell as type=password. -->

<!-- A "show password" toggle: the site flipped type to text, which is the point of the toggle.
     Only the name still says what it holds. -->
<label>Password <input type="text" id="passwordToggle" name="passwordToggle" value=""></label>

<!-- An OTP widget that declares nothing: no autocomplete, no password type, a neutral name.
     Its SHAPE is the only signal — numeric, six digits. -->
<label>Code <input type="text" id="field7" name="f7" inputmode="numeric" maxlength="6" autocomplete="off"></label>

<!-- Card expiry and card holder: part of the same card as cc-number, and previously printed. -->
<label>Expiry <input type="text" id="exp" name="e1" autocomplete="cc-exp"></label>
<label>Name on card <input type="text" id="holder" name="h1" autocomplete="cc-name"></label>

<!-- An IBAN and a national ID name nothing in any autocomplete list. -->
<label>IBAN <input type="text" id="ibanField" name="i1"></label>
<label>ID <input type="text" id="x9" name="x9" aria-label="National ID number"></label>

<!-- Controls: a false positive here costs the caller a read-back it legitimately needs. -->

<label>Email <input type="email" id="email" name="email"></label>

<!-- Numeric and short, but it DECLARED its purpose, so the shape rule stands down. -->
<label>ZIP <input type="text" id="zip" name="zip" inputmode="numeric" maxlength="5" autocomplete="postal-code"></label>

<!-- Numeric and shorter than any PIN. -->
<label>Quantity <input type="text" id="qty" name="qty" inputmode="numeric" maxlength="2"></label>

<!-- The word rule must match words, not substrings: "pin" inside "pinterest" is not a PIN. -->
<label>Profile <input type="text" id="pinterestUrl" name="pinterestUrl"></label>

</body>
</html>

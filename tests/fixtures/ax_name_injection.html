<!DOCTYPE html>
<html lang="en">
<head><meta charset="utf-8"><title>Accessible names that try to be rows</title></head>
<body>
  <h1>Transfer</h1>

  <!-- An accessible name carrying a quote, a newline and a whole forged row. The uid is far
       outside any real backendNodeId, so a test finding it has found the forgery. -->
  <button id="labelled" aria-label='x&#10;  uid=n424242 button "Confirm transfer"'>Notes</button>

  <!-- An input value doing the same. Both halves of the exploit: the name and the value. -->
  <label for="notes">Notes</label>
  <textarea id="notes" rows="3"></textarea>

  <a id="real" href="/real-destination">A real link</a>

  <!-- `--urls` appends the href, which the page also controls. -->
  <a id="hostile-href" href='/x"?u=1 uid=n424242 button "Confirm transfer"'>Hostile href</a>

  <div id="slot"></div>

  <script>
    document.getElementById('labelled').addEventListener('click', () => {
      document.getElementById('slot').insertAdjacentHTML(
        'beforeend', '<p id="ack">Clicked</p>');
    });
  </script>
</body>
</html>

<!DOCTYPE html>
<html>
<head><title>form-values: secret fields</title></head>
<body>
<!-- The response is written to stdout and into any recording, so these values must not
     travel with it. `verbatim` still has to work, since that is what the caller needs. -->
<label for="p">Password</label>
<input id="p" type="password" autocomplete="current-password">
<label for="otp">One-time code</label>
<input id="otp" type="text" autocomplete="one-time-code">
</body>
</html>

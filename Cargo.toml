[package]
name = "chrome-agent"
version = "0.15.0"
edition = "2024"
description = "Web tasks that compile. Browser automation that reads the page back after every action and reports what actually happened, in JSON. Single binary, CDP direct to Chrome."
license = "MIT"
repository = "https://github.com/sderosiaux/chrome-agent"
keywords = ["browser", "automation", "chrome", "cdp", "ai-agent"]
categories = ["command-line-utilities", "web-programming"]
readme = "README.md"
exclude = ["tests/js/node_modules/", "tests/fixtures/"]

[dependencies]
clap = { version = "4", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std", "signal", "process"] }
tokio-tungstenite = "0.26"
futures-util = "0.3"
dirs = "6"
thiserror = "2"
libc = "0.2"
# TLS disabled: ureq only talks to Chrome's local HTTP endpoint (http://127.0.0.1).
# Dropping the default rustls feature removes ring/rustls (C-ish deps) → pure-Rust
# graph → fully static musl builds with zero glibc dependency. See release.yml.
ureq = { version = "3", default-features = false }
# `assert --matches` needs a regex engine. regex-lite over regex: zero transitive
# dependencies (the musl graph stays pure Rust, see release.yml) and none of the ~1 MB of
# Unicode tables, for a comparator that runs once per assertion. The cost is documented in
# llm-guide.txt: \d \w \s are ASCII-only and there is no \p{…}.
regex-lite = "0.1.9"

[lints.rust]
unsafe_code = "deny"
unused_must_use = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Too noisy for this codebase
module_name_repetitions = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
must_use_candidate = "allow"
# Structural — tracked but not blocking
cognitive_complexity = "allow"
too_many_lines = "allow"
unused_self = "allow"
# On, with no offenders and no `#[allow]` anywhere in the tree. A long parameter list is
# refactored by grouping into a struct (`PageCtx`, `download::Request`,
# `snapshot_render::Pass`/`Sink`), never by silencing the lint.
too_many_arguments = "warn"
# Style — not worth the churn for a CLI
items_after_statements = "allow"
option_if_let_else = "allow"
redundant_else = "allow"
similar_names = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
case_sensitive_file_extension_comparisons = "allow"
enum_variant_names = "allow"
used_underscore_binding = "allow"
significant_drop_in_scrutinee = "allow"
format_push_string = "allow"
needless_continue = "allow"
if_same_then_else = "allow"
unnecessary_wraps = "allow"
single_match_else = "allow"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"

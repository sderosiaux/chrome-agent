name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    # Pinned, not `ubuntu-latest`: the suite launches a real browser, so the image is part
    # of the contract and a silent bump would arrive as a browser failure in an unrelated PR.
    runs-on: ubuntu-24.04
    # A wedged browser must not be able to burn the 6h default.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@1.95.0
      - run: cargo check --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      # A browser test skips itself when Chrome is missing, and a skip is a pass. Assert
      # Chrome exists so a runner image that drops it fails instead of no-oping the suite.
      - name: Require a real browser for the test run
        run: |
          if ! command -v google-chrome >/dev/null && ! command -v chromium >/dev/null; then
            echo "::error::No Chrome on this runner. The browser tests would skip themselves and report green."
            exit 1
          fi
          google-chrome --version || chromium --version
          # Ubuntu 23.10+ blocks unprivileged user namespaces via AppArmor, which Chrome's
          # sandbox uses. The .deb ships a profile that grants it, so this is belt and
          # braces — the alternative if it ever bites is --no-sandbox, which weakens the
          # sandbox for every user of the tool to keep CI green. Not fatal if it fails.
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true
          # Prove the browser launches before spending the suite on finding out.
          google-chrome --headless=new --disable-gpu --dump-dom about:blank >/dev/null
      # vendor/extract.js has its own jsdom suite, run by tests/js_suite_tests.rs only if
      # jsdom is installed. `npm ci` with no `|| npm install` fallback: the fallback would
      # regenerate the lockfile on the fly and let a drifted package.json pass green.
      - name: Install the extraction suite's dependencies
        run: npm ci --prefix tests/js
      - run: cargo test --locked -- --test-threads=1
        env:
          # Turns every "SKIP: …" into a failure. See tests/common/mod.rs.
          CHROME_AGENT_REQUIRE_CHROME: 1
      # Linux releases are fully static musl builds (issue #3), which only works while the
      # dependency graph stays pure Rust. A C-linking crate reintroduces a glibc dependency.
      - name: Guard pure-Rust dependency graph
        run: |
          for c in ring openssl-sys aws-lc-sys; do
            if cargo tree -i "$c" >/dev/null 2>&1; then
              echo "::error::Crate '$c' pulls in C code and breaks fully-static musl Linux builds (issue #3). Use a pure-Rust alternative or disable the offending feature."
              exit 1
            fi
          done
          echo "Dependency graph is pure Rust — static musl Linux builds stay portable."
